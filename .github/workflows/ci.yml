name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  GO_VERSION: "1.27.4"
  CGO_ENABLED: "0"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - name: Verify modules (go.mod/go.sum must be tidy and match the checksum database)
        run: |
          go mod download
          go mod verify
          go mod tidy -diff

      - name: Print go.mod and go.sum if they changed
        run: |
          if ! git diff --quiet -- go.mod go.sum 2>/dev/null || ! git ls-files --error-unmatch go.sum >/dev/null 2>&1; then
            echo "===BEGIN go.mod==="; cat go.mod; echo "===END go.mod==="
            echo "===BEGIN go.sum==="; cat go.sum; echo "===END go.sum==="
          fi

      - name: Formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && echo "::error::run gofmt -w ." && exit 1)

      - name: Vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...

      - name: Test (includes the read-only guard)
        run: go test ./...

      - name: Banned-call grep
        run: ./scripts/check-banned.sh

      - name: Build
        run: |
          go build -trimpath -o dist/gm-reader ./cmd/gm-reader
          GOOS=windows GOARCH=amd64 go build -trimpath -o dist/gm-reader.exe ./cmd/gm-reader

      - name: Smoke test (stdio, no network ports, clean exit)
        run: |
          python3 scripts/smoke_test.py dist/gm-reader
          python3 scripts/smoke_test.py dist/gm-reader --no-cache

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - name: Verify modules
        run: |
          go mod download
          go mod verify

      - name: Test (DPAPI round trip runs for real here)
        run: go test ./...

      - name: Build
        run: go build -trimpath -o dist/gm-reader.exe ./cmd/gm-reader

      - name: Smoke test with netstat (no listening or open ports)
        run: |
          python scripts/smoke_test.py dist/gm-reader.exe
          python scripts/smoke_test.py dist/gm-reader.exe --no-cache

  release:
    if: github.event_name == 'release'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - name: Build release binary
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          go mod verify
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o dist/gm-reader.exe ./cmd/gm-reader
          cd dist && sha256sum gm-reader.exe > gm-reader.exe.sha256

      - name: Attach gm-reader.exe to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/gm-reader.exe dist/gm-reader.exe.sha256 --clobber
